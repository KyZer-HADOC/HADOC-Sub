name: Build HADOC Sub for Windows
# Version 1.1.0 — modern fullscreen desktop studio

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the built EXE as a GitHub Release
        required: false
        default: false
        type: boolean
      release_tag:
        description: Release tag (for example v1.0.0)
        required: false
        default: v1.1.0
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run SRT parser tests and syntax checks
        run: |
          python -m pip install -r requirements.txt
          python -m py_compile app.py
          python -m unittest discover -s tests -v

      - name: Build standalone EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --collect-all customtkinter --collect-all darkdetect --name HADOC-Sub app.py

      - name: Upload Windows application artifact
        uses: actions/upload-artifact@v4
        with:
          name: HADOC-Sub-Windows
          path: dist/HADOC-Sub.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-release]'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || 'v1.1.0' }}
          name: HADOC Sub ${{ inputs.release_tag || 'v1.1.0' }}
          target_commitish: ${{ github.sha }}
          files: dist/HADOC-Sub.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
