name: Build HADOC Sub for Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run SRT parser tests and syntax checks
        run: |
          python -m py_compile app.py
          python -m unittest discover -s tests -v

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build standalone EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name HADOC-Sub app.py

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: HADOC-Sub-Windows
          path: dist/HADOC-Sub.exe
          if-no-files-found: error
          retention-days: 30
